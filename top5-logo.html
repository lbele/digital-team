  <style>
    .logo{--ease:cubic-bezier(.65,0,.35,1);--soft:cubic-bezier(.22,.61,.36,1);--white:#fff;--cyan:#1FD4FF}
    .logo *{transform-box:fill-box;animation-fill-mode:both}
    .w{fill:var(--white)} .t{fill:var(--white)} .c{fill:var(--cyan)}

    /* 1. brackets draw in, one continuous line each */
    .lv{transform-origin:50% 0;animation:growY .6s var(--ease) .05s}
    .lh{transform-origin:0 50%;animation:growX .4s var(--ease) .6s}
    .rv{transform-origin:50% 100%;animation:growY .6s var(--ease) .05s}
    .rh{transform-origin:100% 50%;animation:growX .4s var(--ease) .6s}
    @keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}

    /* 2. the 5 fades in, piece by piece, with a very small drift */
    .s1{animation:fadeUp .7s var(--soft) 1s}
    .s2{animation:fadeUp .7s var(--soft) 1.1s}
    .s3{animation:fadeUp .7s var(--soft) 1.25s, glow 2.6s ease-in-out 1.95s infinite}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* 3. after the intro, only the cyan block glows, continuously */
    @keyframes glow{
      0%,100%{filter:drop-shadow(0 0 4px rgba(31,212,255,.15)) drop-shadow(0 0 12px rgba(31,212,255,.08)) drop-shadow(0 0 24px rgba(31,212,255,0))}
      50%{filter:drop-shadow(0 0 8px rgba(31,212,255,.65)) drop-shadow(0 0 22px rgba(31,212,255,.4)) drop-shadow(0 0 40px rgba(31,212,255,.2))}}

    /* 4. lettering fades in, opacity only */
    .l{animation:fade .7s var(--soft) calc(1.4s + var(--i) * .035s)}
    .y.l{animation-delay:calc(1.6s + var(--i) * .05s)}
    @keyframes fade{from{opacity:0}to{opacity:1}}

    .logo .w,.logo .t,.logo .c{animation-fill-mode:both}

    @media (prefers-reduced-motion:reduce){.logo *{animation:none!important}}
